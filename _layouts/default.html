<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>
  <meta
    name="description"
    content="{{ page.description | default: site.description }}"
  >

  <!-- Open Graph -->
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">

  {% if page.social_image %}
    <meta property="og:image" content="{{ page.social_image | absolute_url }}">
  {% else %}
    <meta property="og:image" content="{{ '/assets/images/social/default.png' | absolute_url }}">
  {% endif %}

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="{{ '/assets/images/favicon.png' | relative_url }}"
  >

  <!-- Styles -->
  <link
    rel="stylesheet"
    href="{{ '/assets/css/main.css' | relative_url }}"
  >
  <link
    rel="stylesheet"
    href="{{ '/assets/css/syntax.css' | relative_url }}"
  >
</head>

<body>
  <main>
    {{ content }}
  </main>
  <div class="image-lightbox" id="image-lightbox" aria-hidden="true">
  <button class="lightbox-close" type="button" aria-label="Close image">×</button>
  <img class="lightbox-image" src="" alt="">
</div>

<script>
  const lightbox = document.getElementById("image-lightbox");
  const lightboxImage = lightbox.querySelector(".lightbox-image");
  const closeButton = lightbox.querySelector(".lightbox-close");

  document.querySelectorAll(".post-content img").forEach((image) => {
    image.addEventListener("click", () => {
      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;
      lightbox.classList.add("is-open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.classList.add("lightbox-open");
    });
  });

  function closeLightbox() {
    lightbox.classList.remove("is-open");
    lightbox.setAttribute("aria-hidden", "true");
    document.body.classList.remove("lightbox-open");
  }

  closeButton.addEventListener("click", closeLightbox);

  lightbox.addEventListener("click", (event) => {
    if (event.target === lightbox) {
      closeLightbox();
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      closeLightbox();
    }
  });
</script>
</body>
</html>
