<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Mobile chrome -->
  <meta name="theme-color" content="#fafafa">
  <meta name="color-scheme" content="light">

  <title>{{ page.title | default: site.title }}</title>
  <meta
    name="description"
    content="{{ page.description | default: site.description }}"
  >

  <!-- Open Graph -->
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">

  {% if page.social_image %}
    <meta property="og:image" content="{{ page.social_image | absolute_url }}">
  {% endif %}

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="{{ '/assets/images/favicon.png' | relative_url }}"
  >

  <!-- Fonts -->
  <link
    rel="preload"
    as="font"
    type="font/woff2"
    href="{{ '/assets/fonts/Geist-Variable.woff2' | relative_url }}"
    crossorigin
  >

  <!-- Styles -->
  <link
    rel="stylesheet"
    href="{{ '/assets/css/main.css' | relative_url }}"
  >
  <link
    rel="stylesheet"
    href="{{ '/assets/css/syntax.css' | relative_url }}"
  >
</head>

<body>
  <main>
    {{ content }}
  </main>
  <div class="image-lightbox" id="image-lightbox" aria-hidden="true">
  <button class="lightbox-close" type="button" aria-label="Close image">×</button>
  <img class="lightbox-image" src="" alt="">
</div>

<script>
  const lightbox = document.getElementById("image-lightbox");
  const lightboxImage = lightbox.querySelector(".lightbox-image");
  const closeButton = lightbox.querySelector(".lightbox-close");

  lightbox.setAttribute("role", "dialog");
  lightbox.setAttribute("aria-modal", "true");
  lightbox.setAttribute("aria-label", "Image viewer");

  // body is pinned with position:fixed while the lightbox is open, so the
  // scroll offset has to be stashed and restored or the page jumps to the top.
  let scrollY = 0;

  // whatever opened the lightbox, so focus can go back there on close
  let lastFocused = null;

  // only true when the lightbox was opened with Enter/Space rather than a tap
  let openedWithKeyboard = false;

  // images are wrapped in a real button so they are reachable by Tab and
  // activate on Enter/Space without any extra key handling
  document.querySelectorAll(".post-content img").forEach((image) => {
    const trigger = document.createElement("button");
    trigger.type = "button";
    trigger.className = "image-zoom";
    trigger.setAttribute(
      "aria-label",
      image.alt ? "View larger: " + image.alt : "View larger image"
    );

    image.replaceWith(trigger);
    trigger.appendChild(image);

    trigger.addEventListener("click", (event) => {
      // keyboard activation of a button reports detail 0; a tap or click is >= 1
      openedWithKeyboard = event.detail === 0;
      openLightbox(image, trigger);
    });
  });

  function openLightbox(image, trigger) {
    lightboxImage.src = image.currentSrc || image.src;
    lightboxImage.alt = image.alt;
    resetZoom();

    lightbox.classList.add("is-open");
    lightbox.setAttribute("aria-hidden", "false");

    scrollY = window.scrollY;
    document.body.style.top = `-${scrollY}px`;
    document.body.classList.add("lightbox-open");

    lastFocused = trigger;

    // the close button gets focus on open; only show its ring for keyboard users
    lightbox.classList.toggle("is-keyboard", openedWithKeyboard);

    // the overlay transitions out of visibility:hidden, and a hidden element
    // cannot take focus, so wait for the next frame before moving focus in
    requestAnimationFrame(() =>
      closeButton.focus({ focusVisible: openedWithKeyboard })
    );
  }

  function closeLightbox() {
    if (!lightbox.classList.contains("is-open")) return;

    lightbox.classList.remove("is-open");
    lightbox.setAttribute("aria-hidden", "true");

    document.body.classList.remove("lightbox-open");
    document.body.style.top = "";
    window.scrollTo(0, scrollY);

    resetZoom();

    // Only hand focus back when the lightbox was opened from the keyboard.
    // Focus moved programmatically out of a :focus-visible element still counts
    // as :focus-visible, so restoring it after a tap paints the focus ring and
    // leaves a dark outline sitting around the image once the overlay is gone.
    if (lastFocused && openedWithKeyboard) {
      lastFocused.focus();
    }
    lastFocused = null;
  }

  /* ---- pinch / double-tap zoom ------------------------------------- */

  const ZOOM_MAX = 4;        // hard ceiling
  const ZOOM_STEP = 2.5;     // what a double tap jumps to
  const TAP_MS = 300;        // max gap between the two taps
  const TAP_SLOP = 30;       // max px between them
  const DRAG_SLOP = 10;      // past this a touch is a drag, not a tap

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  let scale = 1;
  let tx = 0;
  let ty = 0;

  const pointers = new Map();
  let pinchStart = null;
  let panStart = null;
  let moved = false;
  let lastTapAt = 0;
  let lastTapX = 0;
  let lastTapY = 0;

  function applyTransform(animate) {
    lightboxImage.style.transition =
      animate && !reduceMotion.matches
        ? "transform 220ms cubic-bezier(0.22, 1, 0.36, 1)"
        : "none";
    lightboxImage.style.transform =
      `translate(${tx}px, ${ty}px) scale(${scale})`;
    lightbox.classList.toggle("is-zoomed", scale > 1);
  }

  function resetZoom() {
    scale = 1;
    tx = 0;
    ty = 0;
    pointers.clear();
    pinchStart = null;
    panStart = null;
    lightbox.classList.remove("is-zoomed");
    // clearing the inline styles hands the image back to the CSS, so the
    // open/close animation still runs off .is-open
    lightboxImage.style.transition = "";
    lightboxImage.style.transform = "";
  }

  // keep the image from being dragged past its own edges
  function clampPan() {
    const w = lightboxImage.offsetWidth;
    const h = lightboxImage.offsetHeight;
    const maxX = Math.max(0, (w * scale - lightbox.clientWidth) / 2);
    const maxY = Math.max(0, (h * scale - lightbox.clientHeight) / 2);

    tx = Math.min(maxX, Math.max(-maxX, tx));
    ty = Math.min(maxY, Math.max(-maxY, ty));
  }

  // zoom to `next`, keeping whatever is under (clientX, clientY) in place
  function zoomTo(next, clientX, clientY, animate) {
    next = Math.min(ZOOM_MAX, Math.max(1, next));

    const rect = lightboxImage.getBoundingClientRect();
    // the element's untransformed centre: the live rect minus the translate
    const originX = rect.left + rect.width / 2 - tx;
    const originY = rect.top + rect.height / 2 - ty;

    const px = clientX - originX;
    const py = clientY - originY;

    // the point of the image currently under the cursor, in unscaled units
    const contentX = (px - tx) / scale;
    const contentY = (py - ty) / scale;

    scale = next;
    tx = px - contentX * next;
    ty = py - contentY * next;

    if (scale === 1) {
      tx = 0;
      ty = 0;
    }

    clampPan();
    applyTransform(animate);
  }

  function onPointerDown(event) {
    if (event.pointerType === "mouse" && event.button !== 0) return;

    lightboxImage.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    moved = false;

    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchStart = {
        dist: Math.hypot(b.x - a.x, b.y - a.y) || 1,
        scale,
        tx,
        ty,
        midX: (a.x + b.x) / 2,
        midY: (a.y + b.y) / 2,
      };
      panStart = null;
    } else if (pointers.size === 1 && scale > 1) {
      panStart = { x: event.clientX, y: event.clientY, tx, ty };
    }
  }

  function onPointerMove(event) {
    if (!pointers.has(event.pointerId)) return;
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

    if (pointers.size === 2 && pinchStart) {
      moved = true;
      const [a, b] = [...pointers.values()];
      const dist = Math.hypot(b.x - a.x, b.y - a.y);

      // rewind to the pinch's starting state so the anchor stays honest
      scale = pinchStart.scale;
      tx = pinchStart.tx;
      ty = pinchStart.ty;

      zoomTo(
        pinchStart.scale * (dist / pinchStart.dist),
        pinchStart.midX,
        pinchStart.midY,
        false
      );
      return;
    }

    if (pointers.size === 1 && panStart) {
      const dx = event.clientX - panStart.x;
      const dy = event.clientY - panStart.y;

      if (Math.hypot(dx, dy) > DRAG_SLOP) moved = true;

      tx = panStart.tx + dx;
      ty = panStart.ty + dy;
      clampPan();
      applyTransform(false);
    }
  }

  function onPointerUp(event) {
    const wasPinching = pointers.size === 2;
    pointers.delete(event.pointerId);

    if (pointers.size < 2) pinchStart = null;

    if (pointers.size === 1) {
      // second finger lifted mid-pinch: carry on panning with the first
      const [p] = [...pointers.values()];
      panStart = scale > 1 ? { x: p.x, y: p.y, tx, ty } : null;
      return;
    }

    panStart = null;
    if (pointers.size > 0) return;

    if (scale <= 1.01 && scale !== 1) {
      resetZoom();
      return;
    }

    if (moved || wasPinching) return;

    const now = Date.now();
    const isDoubleTap =
      now - lastTapAt < TAP_MS &&
      Math.hypot(event.clientX - lastTapX, event.clientY - lastTapY) < TAP_SLOP;

    if (isDoubleTap) {
      lastTapAt = 0;
      if (scale > 1) {
        zoomTo(1, event.clientX, event.clientY, true);
      } else {
        zoomTo(ZOOM_STEP, event.clientX, event.clientY, true);
      }
    } else {
      lastTapAt = now;
      lastTapX = event.clientX;
      lastTapY = event.clientY;
    }
  }

  lightboxImage.addEventListener("pointerdown", onPointerDown);
  lightboxImage.addEventListener("pointermove", onPointerMove);
  lightboxImage.addEventListener("pointerup", onPointerUp);
  lightboxImage.addEventListener("pointercancel", onPointerUp);

  // a zoomed image would otherwise be left hanging off-centre on rotate
  window.addEventListener("resize", () => {
    if (scale === 1) return;
    clampPan();
    applyTransform(false);
  });

  /* ------------------------------------------------------------------ */

  closeButton.addEventListener("click", closeLightbox);

  lightbox.addEventListener("click", (event) => {
    if (event.target === lightbox) {
      closeLightbox();
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      closeLightbox();
      return;
    }

    // the close button is the only focusable thing in the dialog, so trapping
    // Tab means simply keeping it there while the lightbox is open
    if (event.key === "Tab" && lightbox.classList.contains("is-open")) {
      event.preventDefault();
      lightbox.classList.add("is-keyboard");
      closeButton.focus({ focusVisible: true });
    }
  });
</script>

<script>
  document.querySelectorAll(".post-content .highlight").forEach((block) => {
    const pre = block.querySelector("pre");

    if (!pre) return;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "copy-code";
    button.setAttribute("aria-label", "Copy code");
    button.title = "Copy code";

    const copyIcon = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="8" y="8" width="11" height="11" rx="2"></rect>
        <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
      </svg>
    `;

    const checkIcon = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12.5l4 4L19 7"></path>
      </svg>
    `;

    button.innerHTML = copyIcon;
    block.appendChild(button);

    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(pre.innerText);

        button.innerHTML = checkIcon;
        button.setAttribute("aria-label", "Code copied");
        button.title = "Copied";

        setTimeout(() => {
          button.innerHTML = copyIcon;
          button.setAttribute("aria-label", "Copy code");
          button.title = "Copy code";
        }, 1500);
      } catch {
        button.title = "Couldn't copy";
      }
    });
  });
</script>

</body>
</html>
