<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Mobile chrome -->
  <meta name="theme-color" content="#fafafa">
  <meta name="color-scheme" content="light">

  <title>{{ page.title | default: site.title }}</title>
  <meta
    name="description"
    content="{{ page.description | default: site.description }}"
  >

  <!-- Open Graph -->
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">

  {% if page.social_image %}
    <meta property="og:image" content="{{ page.social_image | absolute_url }}">
  {% endif %}

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="{{ '/assets/images/favicon.png' | relative_url }}"
  >

  <!-- Fonts -->
  <link
    rel="preload"
    as="font"
    type="font/woff2"
    href="{{ '/assets/fonts/Geist-Variable.woff2' | relative_url }}"
    crossorigin
  >

  <!-- Styles -->
  <link
    rel="stylesheet"
    href="{{ '/assets/css/main.css' | relative_url }}"
  >
  <link
    rel="stylesheet"
    href="{{ '/assets/css/syntax.css' | relative_url }}"
  >
</head>

<body>
  <main>
    {{ content }}
  </main>
  <div class="image-lightbox" id="image-lightbox" aria-hidden="true">
  <button class="lightbox-close" type="button" aria-label="Close image">×</button>
  <img class="lightbox-image" src="" alt="">
</div>

<script>
  const lightbox = document.getElementById("image-lightbox");
  const lightboxImage = lightbox.querySelector(".lightbox-image");
  const closeButton = lightbox.querySelector(".lightbox-close");

  lightbox.setAttribute("role", "dialog");
  lightbox.setAttribute("aria-modal", "true");
  lightbox.setAttribute("aria-label", "Image viewer");

  // body is pinned with position:fixed while the lightbox is open, so the
  // scroll offset has to be stashed and restored or the page jumps to the top.
  let scrollY = 0;

  // whatever opened the lightbox, so focus can go back there on close
  let lastFocused = null;

  // only true when the lightbox was opened with Enter/Space rather than a tap
  let openedWithKeyboard = false;

  // images are wrapped in a real button so they are reachable by Tab and
  // activate on Enter/Space without any extra key handling
  document.querySelectorAll(".post-content img").forEach((image) => {
    const trigger = document.createElement("button");
    trigger.type = "button";
    trigger.className = "image-zoom";
    trigger.setAttribute(
      "aria-label",
      image.alt ? "View larger: " + image.alt : "View larger image"
    );

    image.replaceWith(trigger);
    trigger.appendChild(image);

    trigger.addEventListener("click", (event) => {
      // keyboard activation of a button reports detail 0; a tap or click is >= 1
      openedWithKeyboard = event.detail === 0;
      openLightbox(image, trigger);
    });
  });

  function openLightbox(image, trigger) {
    lightboxImage.src = image.currentSrc || image.src;
    lightboxImage.alt = image.alt;
    resetZoom();

    lightbox.classList.add("is-open");
    lightbox.setAttribute("aria-hidden", "false");

    scrollY = window.scrollY;
    document.body.style.top = `-${scrollY}px`;
    document.body.classList.add("lightbox-open");

    lastFocused = trigger;

    // the close button gets focus on open; only show its ring for keyboard users
    lightbox.classList.toggle("is-keyboard", openedWithKeyboard);

    // the overlay transitions out of visibility:hidden, and a hidden element
    // cannot take focus, so wait for the next frame before moving focus in
    requestAnimationFrame(() =>
      closeButton.focus({ focusVisible: openedWithKeyboard })
    );
  }

  // set while a swiped-away image finishes flying off; cleared on reopen
  let closeTimer = 0;

  function closeLightbox(options = {}) {
    if (!lightbox.classList.contains("is-open")) return;

    lightbox.classList.remove("is-open", "is-dragging");
    lightbox.setAttribute("aria-hidden", "true");

    document.body.classList.remove("lightbox-open");
    document.body.style.top = "";
    window.scrollTo(0, scrollY);

    // a swiped-away image keeps travelling while the overlay fades, so its
    // inline transform has to outlive the close until the fade is done
    if (options.keepTransform) {
      closeTimer = setTimeout(resetZoom, 250);
    } else {
      resetZoom();
    }

    // Only hand focus back when the lightbox was opened from the keyboard.
    // Focus moved programmatically out of a :focus-visible element still counts
    // as :focus-visible, so restoring it after a tap paints the focus ring and
    // leaves a dark outline sitting around the image once the overlay is gone.
    if (lastFocused && openedWithKeyboard) {
      lastFocused.focus();
    }
    lastFocused = null;
  }

  /* ---- pinch, pan, double-tap zoom and swipe to dismiss ------------- */

  const ZOOM_MAX = 4;           // where pinching starts to resist
  const ZOOM_STEP = 2.5;        // what a double tap jumps to
  const TAP_MS = 300;           // max gap between the two taps
  const TAP_SLOP = 30;          // max px between them
  const DRAG_SLOP = 10;         // past this a touch is a drag, not a tap
  const DISMISS_DISTANCE = 120; // px of vertical drag that closes on release
  const DISMISS_VELOCITY = 0.5; // px/ms flick that closes regardless

  // A pan keeps gliding after the finger lifts. The curve's starting slope
  // (0.5 / 0.25 = 2) means GLIDE_MS / 2 of travel begins at exactly the
  // finger's speed, so letting go neither lurches nor stalls.
  const GLIDE_MS = 560;
  const GLIDE = `${GLIDE_MS}ms cubic-bezier(0.25, 0.5, 0.25, 1)`;
  const SNAP = "320ms cubic-bezier(0.22, 1, 0.36, 1)";

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  let scale = 1;
  let tx = 0;
  let ty = 0;

  const pointers = new Map();
  let gesture = null; // "pan" | "pinch" | "dismiss" | "none" | null (undecided)
  let start = null;
  let lastMid = null;
  let moved = false;
  let downOnBackdrop = false;
  let samples = [];
  let lastTapAt = 0;
  let lastTapX = 0;
  let lastTapY = 0;

  function render(transition) {
    lightboxImage.style.transition =
      transition && !reduceMotion.matches ? transition : "none";
    lightboxImage.style.transform =
      `translate(${tx}px, ${ty}px) scale(${scale})`;
    lightbox.classList.toggle("is-zoomed", scale > 1);
  }

  // how far a swipe-to-dismiss has got, 0–1; the CSS fades the backdrop
  function setDismiss(progress, animate) {
    lightbox.classList.toggle("is-dragging", !animate);
    lightbox.style.setProperty("--dismiss", progress);
  }

  function resetZoom() {
    clearTimeout(closeTimer);
    scale = 1;
    tx = 0;
    ty = 0;
    pointers.clear();
    gesture = null;
    start = null;
    lightbox.classList.remove("is-zoomed", "is-dragging");
    lightbox.style.removeProperty("--dismiss");
    // clearing the inline styles hands the image back to the CSS, so the
    // open/close animation still runs off .is-open
    lightboxImage.style.transition = "";
    lightboxImage.style.transform = "";
  }

  // the image's untransformed centre in viewport coordinates
  // (the overlay is position:fixed at 0,0, so it is the offsetParent)
  function origin() {
    return {
      x: lightboxImage.offsetLeft + lightboxImage.offsetWidth / 2,
      y: lightboxImage.offsetTop + lightboxImage.offsetHeight / 2,
    };
  }

  // the translate range that keeps the screen covered by the image, or pins
  // it on any axis where the image is smaller than the screen
  function bounds() {
    const o = origin();
    const halfW = (lightboxImage.offsetWidth * scale) / 2;
    const halfH = (lightboxImage.offsetHeight * scale) / 2;
    const W = lightbox.clientWidth;
    const H = lightbox.clientHeight;

    const x = halfW * 2 > W ? [W - o.x - halfW, halfW - o.x] : [0, 0];
    const y = halfH * 2 > H ? [H - o.y - halfH, halfH - o.y] : [0, 0];
    return { minX: x[0], maxX: x[1], minY: y[0], maxY: y[1] };
  }

  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

  // past an edge, movement is damped the way native scroll views are,
  // rather than stopping dead
  function rubber(v, min, max, size) {
    const damp = (over) => (1 - 1 / ((over * 0.55) / size + 1)) * size;
    if (v < min) return min - damp(min - v);
    if (v > max) return max + damp(v - max);
    return v;
  }

  // past the zoom limits, pinching meets resistance rather than a wall:
  // never more than 1.5× over the ceiling, or half way under 1
  function softScale(s) {
    if (s > ZOOM_MAX) {
      const over = s / ZOOM_MAX - 1;
      return ZOOM_MAX * (1 + 0.5 * (over / (over + 1)));
    }
    if (s < 1) return 1 - (1 - s) * 0.5;
    return s;
  }

  // change scale while keeping the point under (x, y) fixed on screen
  function scaleAround(next, x, y) {
    const o = origin();
    const cx = (x - o.x - tx) / scale;
    const cy = (y - o.y - ty) / scale;
    scale = next;
    tx = x - o.x - cx * scale;
    ty = y - o.y - cy * scale;
  }

  function track(x, y) {
    const now = performance.now();
    samples.push({ t: now, x, y });
    while (samples.length > 2 && now - samples[0].t > 100) samples.shift();
  }

  // finger speed over the last ~100ms, in px/ms
  function velocity() {
    if (samples.length < 2) return { x: 0, y: 0 };
    const a = samples[0];
    const b = samples[samples.length - 1];
    // the finger stopped before lifting: nothing to glide on
    if (performance.now() - b.t > 60) return { x: 0, y: 0 };
    const dt = b.t - a.t || 1;
    return { x: (b.x - a.x) / dt, y: (b.y - a.y) / dt };
  }

  // touching mid-animation picks the image up where it is on screen,
  // not where the animation was heading
  function syncFromScreen() {
    const m = new DOMMatrix(getComputedStyle(lightboxImage).transform);
    scale = m.a;
    tx = m.e;
    ty = m.f;
    render(null);
  }

  // bring scale and position back inside their limits, carrying on from
  // any flick when `glide` is set
  function settle(anchor, glide) {
    const target = clamp(scale, 1, ZOOM_MAX);
    if (target !== scale) {
      const o = origin();
      const a = anchor || { x: o.x + tx, y: o.y + ty };
      scaleAround(target, a.x, a.y);
    }
    if (scale === 1) {
      tx = 0;
      ty = 0;
    }

    let transition = `transform ${SNAP}`;
    if (glide) {
      const v = velocity();
      if (Math.hypot(v.x, v.y) > 0.05) {
        tx += v.x * (GLIDE_MS / 2);
        ty += v.y * (GLIDE_MS / 2);
        transition = `transform ${GLIDE}`;
      }
    }

    const b = bounds();
    tx = clamp(tx, b.minX, b.maxX);
    ty = clamp(ty, b.minY, b.maxY);
    render(transition);
  }

  function zoomTo(next, x, y) {
    scaleAround(clamp(next, 1, ZOOM_MAX), x, y);
    settle(null, false);
  }

  function beginGesture(pointerType) {
    const pts = [...pointers.values()];
    samples = [];

    if (pts.length >= 2) {
      const [a, b] = pts;
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const o = origin();

      if (gesture === "dismiss") setDismiss(0, true);
      gesture = "pinch";
      moved = true; // two fingers down is never a tap
      lastMid = mid;
      start = {
        dist: Math.hypot(b.x - a.x, b.y - a.y) || 1,
        scale,
        // the point of the image under the fingers, relative to its centre
        cx: (mid.x - o.x - tx) / scale,
        cy: (mid.y - o.y - ty) / scale,
      };
    } else if (pts.length === 1) {
      gesture = null; // decided once the finger moves past DRAG_SLOP
      start = { x: pts[0].x, y: pts[0].y, tx, ty, pointerType };
    }
  }

  function onPointerDown(event) {
    if (!lightbox.classList.contains("is-open")) return;
    if (event.target.closest(".lightbox-close")) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;

    lightbox.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

    if (pointers.size === 1) {
      downOnBackdrop = event.target === lightbox;
      moved = false;
      syncFromScreen();
    }
    beginGesture(event.pointerType);
  }

  function onPointerMove(event) {
    if (!pointers.has(event.pointerId)) return;
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    const pts = [...pointers.values()];

    if (gesture === "pinch" && pts.length >= 2) {
      const [a, b] = pts;
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const o = origin();

      // scale follows the spread of the fingers and the image follows their
      // midpoint, so a pinch can pan at the same time
      scale = softScale(
        (start.scale * Math.hypot(b.x - a.x, b.y - a.y)) / start.dist
      );
      tx = mid.x - o.x - start.cx * scale;
      ty = mid.y - o.y - start.cy * scale;
      lastMid = mid;
      render(null);
      return;
    }

    if (pts.length !== 1 || !start || gesture === "none") return;

    track(event.clientX, event.clientY);
    let dx = event.clientX - start.x;
    let dy = event.clientY - start.y;

    if (!gesture) {
      if (Math.hypot(dx, dy) < DRAG_SLOP) return;
      moved = true;

      if (scale > 1) gesture = "pan";
      else if (start.pointerType !== "mouse") gesture = "dismiss";
      else gesture = "none";

      // measure from here, so the image doesn't jump by the slop distance
      start.x = event.clientX;
      start.y = event.clientY;
      dx = 0;
      dy = 0;
    }

    if (gesture === "pan") {
      const b = bounds();
      tx = rubber(start.tx + dx, b.minX, b.maxX, lightbox.clientWidth);
      ty = rubber(start.ty + dy, b.minY, b.maxY, lightbox.clientHeight);
      render(null);
    } else if (gesture === "dismiss") {
      const progress = Math.min(1, Math.abs(dy) / (lightbox.clientHeight / 2));
      tx = dx;
      ty = dy;
      scale = 1 - 0.15 * progress;
      render(null);
      setDismiss(progress, false);
    }
  }

  function finishDismiss(cancelled) {
    const v = velocity();
    const flicked =
      Math.abs(v.y) > DISMISS_VELOCITY && Math.sign(v.y) === Math.sign(ty);

    if (!cancelled && ty !== 0 && (Math.abs(ty) > DISMISS_DISTANCE || flicked)) {
      // carry on the way it was thrown while the overlay fades out
      tx += v.x * (GLIDE_MS / 2);
      ty += Math.sign(ty) * lightbox.clientHeight * 0.4;
      render("transform 240ms cubic-bezier(0.3, 0.6, 0.5, 1)");
      closeLightbox({ keepTransform: true });
      return;
    }

    scale = 1;
    tx = 0;
    ty = 0;
    render(`transform ${SNAP}`);
    setDismiss(0, true);
  }

  function onPointerUp(event) {
    if (!pointers.has(event.pointerId)) return;
    pointers.delete(event.pointerId);
    const cancelled = event.type === "pointercancel";

    if (pointers.size > 0) {
      if (gesture !== "pinch" || pointers.size > 1) return;

      // one finger lifted mid-pinch: settle any overshoot, then let the
      // remaining finger pan if there is anything to pan
      const overshot = scale < 1 || scale > ZOOM_MAX;
      if (overshot) settle(lastMid, false);
      beginGesture(event.pointerType);
      gesture = !overshot && scale > 1 ? "pan" : "none";
      return;
    }

    const finished = gesture;
    gesture = null;
    start = null;

    if (finished === "dismiss") {
      finishDismiss(cancelled);
      return;
    }
    if (finished === "pinch") {
      settle(lastMid, false);
      return;
    }
    if (finished || moved || cancelled) {
      settle(null, finished === "pan");
      return;
    }

    // a tap on the backdrop closes; a double tap on the image zooms
    if (downOnBackdrop) {
      closeLightbox();
      return;
    }

    const now = Date.now();
    const isDoubleTap =
      now - lastTapAt < TAP_MS &&
      Math.hypot(event.clientX - lastTapX, event.clientY - lastTapY) < TAP_SLOP;

    if (isDoubleTap) {
      lastTapAt = 0;
      zoomTo(scale > 1 ? 1 : ZOOM_STEP, event.clientX, event.clientY);
    } else {
      lastTapAt = now;
      lastTapX = event.clientX;
      lastTapY = event.clientY;
    }
  }

  // listen on the whole overlay, not just the image, so a pinch or swipe
  // that starts beside a short landscape image still lands
  lightbox.addEventListener("pointerdown", onPointerDown);
  lightbox.addEventListener("pointermove", onPointerMove);
  lightbox.addEventListener("pointerup", onPointerUp);
  lightbox.addEventListener("pointercancel", onPointerUp);

  // a zoomed image would otherwise be left hanging off-centre on rotate
  window.addEventListener("resize", () => {
    if (scale === 1) return;
    const b = bounds();
    tx = clamp(tx, b.minX, b.maxX);
    ty = clamp(ty, b.minY, b.maxY);
    render(null);
  });

  /* ------------------------------------------------------------------ */

  closeButton.addEventListener("click", () => closeLightbox());

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      closeLightbox();
      return;
    }

    // the close button is the only focusable thing in the dialog, so trapping
    // Tab means simply keeping it there while the lightbox is open
    if (event.key === "Tab" && lightbox.classList.contains("is-open")) {
      event.preventDefault();
      lightbox.classList.add("is-keyboard");
      closeButton.focus({ focusVisible: true });
    }
  });
</script>

<script>
  // a note for anyone who opens the console
  console.log(
    "%chello.%c\n\nthis site is plain html, one font and a little jekyll.\nno frameworks, no tracking. built with claude.\n\nfind me on linkedin: https://www.linkedin.com/in/callumlinning/",
    "font: 400 16px Geist, sans-serif; color: #333333;",
    "font: 300 13px Geist, sans-serif; color: #6f6f6f; line-height: 1.6;"
  );
</script>

<script>
  document.querySelectorAll(".post-content .highlight").forEach((block) => {
    const pre = block.querySelector("pre");

    if (!pre) return;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "copy-code";
    button.setAttribute("aria-label", "Copy code");
    button.title = "Copy code";

    const copyIcon = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="8" y="8" width="11" height="11" rx="2"></rect>
        <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
      </svg>
    `;

    const checkIcon = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12.5l4 4L19 7"></path>
      </svg>
    `;

    button.innerHTML = copyIcon;
    block.appendChild(button);

    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(pre.innerText);

        button.innerHTML = checkIcon;
        button.setAttribute("aria-label", "Code copied");
        button.title = "Copied";

        setTimeout(() => {
          button.innerHTML = copyIcon;
          button.setAttribute("aria-label", "Copy code");
          button.title = "Copy code";
        }, 1500);
      } catch {
        button.title = "Couldn't copy";
      }
    });
  });
</script>

</body>
</html>
