---
layout: default
---

<article class="post">

  <header class="post-header">
    <a class="back-link" href="{{ '/' | relative_url }}">← Notes</a>

    <h1>{{ page.title }}</h1>

    {% if page.description %}
      <p class="post-intro">{{ page.description }}</p>
    {% endif %}

    <time datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%-d %B %Y" }}
    </time>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
