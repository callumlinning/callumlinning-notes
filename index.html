title: Callum Linning

<h1>Callum Linning</h1>

<p class="tagline">
  Microsoft 365 consultant
</p>

<section class="homepage-section intro">
  <p>
    I like to build and experiment with things.
  </p>
</section>

<section class="homepage-section writing">
  <h2>Notes</h2>

  {% for post in site.posts %}
    <a class="post-item" href="{{ post.url | relative_url }}">
      <div class="post-title">
        {{ post.title }}
      </div>

      <div class="post-description">
        {{ post.description }}
      </div>

      <time datetime="{{ post.date | date_to_xmlschema }}">
        {{ post.date | date: "%-d %b %Y" }}
      </time>
    </a>
  {% endfor %}
</section>
